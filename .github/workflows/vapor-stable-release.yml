name: Vapor stable release

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vapor-stable-release
  cancel-in-progress: false

jobs:
  build-stage:
    name: Build and stage standalone Vapor
    runs-on: windows-2022
    outputs:
      version: ${{ steps.bootstrap.outputs.version }}
    steps:
      - name: Select Python for signed bootstrap verification
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Verify and install the signed Vapor bootstrap
        id: bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess
          import tarfile
          import urllib.request

          origin = "https://vapor.ghf-studios.site"
          platform = "windows-x86_64"
          target = "x86_64-pc-windows-gnullvm"
          key_id = "vapor-release-2026-11-24"
          raw_key = bytes.fromhex("1e3ab22c2cf6cb7c67cf92ca5a9e242e8fc697c15ed04589da4cbd7ed1842a43")
          api = f"{origin}/api/updates/v1/vapor/stable/{platform}/latest.json"
          with urllib.request.urlopen(api, timeout=30) as response:
              manifest_bytes = response.read(64 * 1024 + 1)
              if len(manifest_bytes) > 64 * 1024:
                  raise SystemExit("release manifest is too large")
          with urllib.request.urlopen(api + ".sig", timeout=30) as response:
              signature_hex = response.read(256).decode("ascii").strip()
          if not re.fullmatch(r"[0-9a-f]{128}", signature_hex):
              raise SystemExit("release signature is malformed")
          manifest = json.loads(manifest_bytes)
          if manifest.get("key_id") != key_id or manifest.get("channel") != "stable" or manifest.get("platform") != platform:
              raise SystemExit("release manifest identity does not match the pinned Vapor release")
          version = manifest.get("version")
          if not isinstance(version, str) or not re.fullmatch(r"0\.5\.0-pre-alpha-(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)", version):
              raise SystemExit("stable bootstrap version does not follow the pinned pre-alpha SemVer policy")
          setup = manifest.get("setup")
          if not isinstance(setup, dict):
              raise SystemExit("release manifest has no signed setup payload")
          archive = manifest.get("artifact")
          if not isinstance(archive, dict):
              raise SystemExit("release manifest has no signed application archive")
          archive_url = archive.get("url")
          expected_archive_url = f"{origin}/api/updates/v1/vapor/releases/{version}/{platform}/vapor.tar.gz"
          if archive_url != expected_archive_url:
              raise SystemExit("signed archive URL is outside the expected immutable release path")
          archive_size = archive.get("size")
          archive_digest = archive.get("sha256")
          if not isinstance(archive_size, int) or archive_size <= 0 or archive_size > 1024 * 1024 * 1024 or not re.fullmatch(r"[0-9a-f]{64}", str(archive_digest)):
              raise SystemExit("signed archive size or digest is invalid")
          setup_url = setup.get("url")
          expected_setup_url = f"{origin}/api/updates/v1/vapor/releases/{version}/{platform}/vapor-setup.exe"
          setup_size = setup.get("size")
          setup_digest = setup.get("sha256")
          if setup_url != expected_setup_url or not isinstance(setup_size, int) or setup_size <= 0 or not re.fullmatch(r"[0-9a-f]{64}", str(setup_digest)):
              raise SystemExit("signed setup identity, size, or digest is invalid")

          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          public_der = temp / "vapor-release-public.der"
          public_der.write_bytes(bytes.fromhex("302a300506032b6570032100") + raw_key)
          manifest_path = temp / "vapor-release-manifest.json"
          signature_path = temp / "vapor-release-manifest.sig"
          manifest_path.write_bytes(manifest_bytes)
          signature_path.write_bytes(bytes.fromhex(signature_hex))
          subprocess.run([
              "openssl", "pkeyutl", "-verify", "-pubin", "-keyform", "DER",
              "-inkey", str(public_der), "-rawin", "-in", str(manifest_path),
              "-sigfile", str(signature_path),
          ], check=True, stdout=subprocess.DEVNULL)

          with urllib.request.urlopen(archive_url, timeout=300) as response:
              archive_bytes = response.read(archive_size + 1)
          if len(archive_bytes) != archive_size or hashlib.sha256(archive_bytes).hexdigest() != archive_digest:
              raise SystemExit("Vapor archive does not match its authenticated size and digest")
          archive_path = temp / "vapor-bootstrap.tar.gz"
          archive_path.write_bytes(archive_bytes)
          bootstrap_root = temp / "vapor-bootstrap"
          bootstrap_bin = bootstrap_root / "bin" / target
          bootstrap_bin.mkdir(parents=True)
          expected_setup_member = f"bin/{target}/vapor-setup.exe"
          expected_runtime_member = f"bin/{target}/libunwind.dll"
          extracted = set()
          with tarfile.open(archive_path, "r:gz") as package:
              for member in package:
                  member_path = pathlib.PurePosixPath(member.name)
                  if member_path.is_absolute() or ".." in member_path.parts:
                      continue
                  member_name = member_path.as_posix()
                  if member_name not in {expected_setup_member, expected_runtime_member}:
                      continue
                  if member_name in extracted:
                      raise SystemExit(f"bootstrap archive contains a duplicate required file: {member_name}")
                  if not member.isfile() or member.size <= 0 or member.size > 512 * 1024 * 1024:
                      raise SystemExit(f"bootstrap archive contains an invalid required file: {member_name}")
                  stream = package.extractfile(member)
                  if stream is None:
                      raise SystemExit(f"could not read bootstrap member: {member_name}")
                  destination = bootstrap_root.joinpath(*member_path.parts)
                  digest = hashlib.sha256()
                  size = 0
                  with destination.open("wb") as output:
                      for block in iter(lambda: stream.read(1024 * 1024), b""):
                          size += len(block)
                          digest.update(block)
                          output.write(block)
                  if size != member.size:
                      raise SystemExit(f"bootstrap member size mismatch: {member_name}")
                  if member_name == expected_setup_member and (size != setup_size or digest.hexdigest() != setup_digest):
                      raise SystemExit("vapor-setup does not match its authenticated size and digest")
                  extracted.add(member_name)
          if extracted != {expected_setup_member, expected_runtime_member}:
              raise SystemExit("signed Windows archive is missing vapor-setup.exe or libunwind.dll")
          setup_path = bootstrap_bin / "vapor-setup.exe"
          setup_shell_path = subprocess.check_output(["cygpath", "-u", str(setup_path)], text=True).strip()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"VAPOR_BOOTSTRAP_SETUP={setup_shell_path}\n")
              env.write(f"VAPOR_BOOTSTRAP_VERSION={version}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          PY

      - name: Install Vapor and provision its build toolchain
        shell: bash
        run: |
          set -euo pipefail
          vapor_root="$($VAPOR_BOOTSTRAP_SETUP install --channel stable --print-root)"
          vapor_root_shell="$(cygpath -u "$vapor_root")"
          test -x "$vapor_root_shell/bin/x86_64-pc-windows-gnullvm/vapor-installer.exe"
          echo "VAPOR_HOME=$vapor_root" >> "$GITHUB_ENV"
          echo "$vapor_root/bin/x86_64-pc-windows-gnullvm" >> "$GITHUB_PATH"
          export PATH="$vapor_root_shell/bin/x86_64-pc-windows-gnullvm:$PATH"
          # The currently published Windows bootstrap predates `role promote`;
          # its supported setup path provisions the same Developer toolchain.
          vapor-installer dev-env install
          vapor-installer superworkspace create

      - name: Resolve and clone exact source revisions through Vapor
        shell: bash
        env:
          VAPOR_CLIENT_REVISION: ${{ github.sha }}
          VAPOR_SOURCE_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Pin the release-preparation API to the Platform revision currently
          # deployed on main. Updating this pin is an explicit release-pipeline
          # change; never resolve a mutable branch during a release build.
          VAPOR_PLATFORM_REVISION=5ad1adae67f9a3b527f03ab8f9737474e7e9fc9d
          if [[ ! "$VAPOR_PLATFORM_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Invalid pinned Platform source revision' >&2
            exit 1
          fi
          runner_temp="$(cygpath -u "$RUNNER_TEMP")"
          credential_helper="$runner_temp/vapor-git-credential"
          cat > "$credential_helper" <<'SH'
          #!/bin/sh
          protocol=
          host=
          path=
          while IFS= read -r line; do
            case "$line" in
              protocol=*) protocol=${line#protocol=} ;;
              host=*) host=${line#host=} ;;
              path=*) path=${line#path=} ;;
            esac
          done
          case "$protocol:$host:$path" in
            https:github.com:GHF-Studios/*)
              printf 'username=x-access-token\npassword=%s\n' "$VAPOR_SOURCE_READ_TOKEN"
              ;;
          esac
          SH
          chmod 700 "$credential_helper"
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0=credential.https://github.com.useHttpPath
          export GIT_CONFIG_VALUE_0=true
          export GIT_CONFIG_KEY_1=credential.helper
          export GIT_CONFIG_VALUE_1="!$credential_helper"
          export GIT_TERMINAL_PROMPT=0
          # The signed bootstrap release predates managed-Git provisioning.
          # For this one source-acquisition transition, explicitly select the
          # runner Git as Vapor's provider. All clone/fetch/checkout/submodule
          # operations still run through `vapor provider git run`; do not call
          # Git directly here or persist this override into later steps.
          git_shell="$(command -v git)"
          test -x "$git_shell"
          VAPOR_GIT="$(cygpath -w "$git_shell")"
          export VAPOR_GIT
          vapor-installer source clone Vapor-Client --revision "$VAPOR_CLIENT_REVISION"
          vapor-installer source clone Vapor-Platform-Server --revision "$VAPOR_PLATFORM_REVISION"
          unset VAPOR_GIT

      - name: Build and stage with Vapor
        shell: bash
        run: |
          set -euo pipefail
          client="$HOME/Vapor/sources/Vapor-Client"
          cd "$client"
          # Source cloning records the checkout in the Superworkspace, but it
          # does not make it Vapor's active source. Select this exact checkout
          # for the one-shot managed build without changing saved user state.
          client_windows="$(cygpath -w "$client")"
          VAPOR_DISTRIBUTION_JOB=steam-release-v1 VAPOR_WORKSPACE="$client_windows" vapor root build --release --release-targets
          runner_temp="$(cygpath -u "$RUNNER_TEMP")"
          vapor root stage-standalone --release-targets | tee "$runner_temp/vapor-stage.log"
          python - "$runner_temp/vapor-stage.log" "$GITHUB_ENV" <<'PY'
          import re
          import sys
          from pathlib import Path
          log = Path(sys.argv[1]).read_text()
          matches = re.findall(r"^Staged .* at (.+)\.$", log, re.MULTILINE)
          if len(matches) != 1:
              raise SystemExit("Vapor did not report exactly one standalone stage root")
          with Path(sys.argv[2]).open("a") as env:
              env.write(f"VAPOR_STAGED_ROOT={matches[0]}\n")
          PY

      - name: Verify Windows setup and prepare the package job inputs
        shell: bash
        run: |
          set -euo pipefail
          client="$HOME/Vapor/sources/Vapor-Client"
          context="$(cygpath -u "$RUNNER_TEMP")/vapor-package-context"
          stage_root="$(cygpath -u "$VAPOR_STAGED_ROOT")"
          python "$client/release/verify-standalone-setup.py" \
            "$stage_root/bin/x86_64-pc-windows-gnullvm/vapor-setup.exe"
          mkdir -p "$context/staged-app" "$context/repo/release" "$context/platform/deploy/scripts"
          cp -R "$stage_root/." "$context/staged-app/"
          cp "$client/Standalone-App.vapor.toml" "$context/repo/Standalone-App.vapor.toml"
          cp "$client/release/"* "$context/repo/release/"
          cp "$HOME/Vapor/sources/Vapor-Platform-Server/deploy/scripts/prepare-vapor-release-bundle.sh" \
            "$context/platform/deploy/scripts/prepare-vapor-release-bundle.sh"

      - name: Upload staged files for Linux packaging and ABI validation
        uses: actions/upload-artifact@v7
        with:
          name: vapor-standalone-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vapor-package-context/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  package-candidate:
    name: Package and validate standalone Vapor
    needs: build-stage
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Select Python for package verification
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Download Vapor-managed staged files
        uses: actions/download-artifact@v8
        with:
          name: vapor-standalone-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vapor-package-context

      - name: Package and verify both platforms
        id: package
        shell: bash
        env:
          VAPOR_BOOTSTRAP_VERSION: ${{ needs.build-stage.outputs.version }}
        run: |
          set -euo pipefail
          context="$RUNNER_TEMP/vapor-package-context"
          client="$context/repo"
          stage="$context/staged-app"
          platform="$context/platform"
          find "$stage/bin/x86_64-unknown-linux-gnu" -type f -exec chmod a+x {} +
          chmod a+x "$stage/bin/vapor-launch.sh"
          version="$(bash "$client/release/pre-alpha-version.sh" "$VAPOR_BOOTSTRAP_VERSION")"
          linux_archive="$RUNNER_TEMP/vapor-linux.tar.gz"
          windows_archive="$RUNNER_TEMP/vapor-windows.tar.gz"
          bash "$client/release/package-vapor-standalone-archive.sh" "$stage" linux-x86_64 "$version" "$linux_archive"
          bash "$client/release/package-vapor-standalone-archive.sh" "$stage" windows-x86_64 "$version" "$windows_archive"
          candidate="$RUNNER_TEMP/vapor-release-candidate"
          mkdir -p "$candidate"
          cp "$linux_archive" "$candidate/vapor-linux.tar.gz"
          cp "$windows_archive" "$candidate/vapor-windows.tar.gz"
          cp "$platform/deploy/scripts/prepare-vapor-release-bundle.sh" "$candidate/prepare-vapor-release-bundle.sh"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload short-lived standalone candidate
        uses: actions/upload-artifact@v7
        with:
          name: vapor-standalone-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vapor-release-candidate/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Sign and publish standalone Vapor
    if: github.ref == 'refs/heads/main'
    needs: package-candidate
    runs-on: ubuntu-22.04
    environment: vapor-stable-release
    steps:
      - name: Download this run's staged candidate
        uses: actions/download-artifact@v8
        with:
          name: vapor-standalone-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vapor-release-candidate

      - name: Sign and validate immutable platform bundles
        shell: bash
        env:
          VAPOR_RELEASE_SIGNING_KEY_B64: ${{ secrets.VAPOR_RELEASE_SIGNING_KEY_B64 }}
          VAPOR_RELEASE_VERSION: ${{ needs.package-candidate.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$VAPOR_RELEASE_SIGNING_KEY_B64" || { echo 'Missing environment secret VAPOR_RELEASE_SIGNING_KEY_B64' >&2; exit 1; }
          umask 077
          key="$RUNNER_TEMP/vapor-release-private.pem"
          printf '%s' "$VAPOR_RELEASE_SIGNING_KEY_B64" | base64 --decode > "$key"
          chmod 600 "$key"
          candidate="$RUNNER_TEMP/vapor-release-candidate"
          prep="$candidate/prepare-vapor-release-bundle.sh"
          test -f "$candidate/vapor-linux.tar.gz"
          test -f "$candidate/vapor-windows.tar.gz"
          test -f "$prep"
          bash "$prep" "$candidate/vapor-linux.tar.gz" "$VAPOR_RELEASE_VERSION" stable linux-x86_64 0.5.0 vapor-release-2026-11-24 "$key" "$RUNNER_TEMP/vapor-release-linux"
          bash "$prep" "$candidate/vapor-windows.tar.gz" "$VAPOR_RELEASE_VERSION" stable windows-x86_64 0.5.0 vapor-release-2026-11-24 "$key" "$RUNNER_TEMP/vapor-release-windows"

      - name: Publish verified bundles through the restricted publisher key
        shell: bash
        env:
          VAPOR_RELEASE_SSH_HOST: ${{ vars.VAPOR_RELEASE_SSH_HOST }}
          VAPOR_RELEASE_SSH_USER: ${{ vars.VAPOR_RELEASE_SSH_USER }}
          VAPOR_RELEASE_SSH_KNOWN_HOSTS: ${{ secrets.VAPOR_RELEASE_SSH_KNOWN_HOSTS }}
          VAPOR_RELEASE_SSH_PRIVATE_KEY: ${{ secrets.VAPOR_RELEASE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in VAPOR_RELEASE_SSH_HOST VAPOR_RELEASE_SSH_USER VAPOR_RELEASE_SSH_KNOWN_HOSTS VAPOR_RELEASE_SSH_PRIVATE_KEY; do
            test -n "${!name}" || { echo "Missing protected publisher setting: $name" >&2; exit 1; }
          done
          umask 077
          key="$RUNNER_TEMP/vapor-publisher-key"
          known_hosts="$RUNNER_TEMP/vapor-publisher-known-hosts"
          printf '%s\n' "$VAPOR_RELEASE_SSH_PRIVATE_KEY" > "$key"
          printf '%s\n' "$VAPOR_RELEASE_SSH_KNOWN_HOSTS" > "$known_hosts"
          chmod 600 "$key" "$known_hosts"
          for platform in linux windows; do
            case "$platform" in
              linux) bundle="$RUNNER_TEMP/vapor-release-linux"; target=linux-x86_64 ;;
              windows) bundle="$RUNNER_TEMP/vapor-release-windows"; target=windows-x86_64 ;;
            esac
            tar -C "$bundle" -czf - . | ssh -T \
              -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" \
              "$VAPOR_RELEASE_SSH_USER@$VAPOR_RELEASE_SSH_HOST" "publish $target"
          done
