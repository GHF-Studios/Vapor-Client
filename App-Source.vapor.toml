schema = 1

[root]
name = "vapor-client"
organization = "ghf-studios"
version = "0.5.0"
repository = "https://github.com/GHF-Studios/Vapor-Client"

[root.steam]
app-id = 2122620
development-branch = "vapor-dev"

[root.steam.depots.common]
id = 2122621

[[root.steam.depots.common.include]]
root = "source"
from = "App.vapor.toml"
to = "App.vapor.toml"
required = true

[[root.steam.depots.common.include]]
root = "installation"
from = "metadata/toolchain.toml"
to = "metadata/toolchain.toml"
required = true

# The default App is a depot-owned runtime closure, assembled from reviewed
# content packages. Source and mutable Library/index state are excluded.
[[root.steam.depots.common.include]]
root = "output"
from = "content/packages/ghf-studios_loo-cast_spacetime-engine/Engine.vapor.toml"
to = "content/default/ghf-studios/loo-cast/spacetime-engine/Engine.vapor.toml"
required = true

[[root.steam.depots.common.include]]
root = "output"
from = "content/packages/ghf-studios_loo-cast_spacetime-engine/assets"
to = "content/default/ghf-studios/loo-cast/spacetime-engine/assets"
required = true

[[root.steam.depots.common.include]]
root = "output"
from = "content/packages/ghf-studios_loo-cast_loo-cast-game/Game.vapor.toml"
to = "content/default/ghf-studios/loo-cast/loo-cast-game/Game.vapor.toml"
required = true

[[root.steam.depots.common.include]]
root = "output"
from = "content/packages/ghf-studios_loo-cast_loo-cast-packagepack/Packagepack.vapor.toml"
to = "content/default/ghf-studios/loo-cast/loo-cast-packagepack/Packagepack.vapor.toml"
required = true

[root.steam.depots.linux]
id = 2122622

[[root.steam.depots.linux.include]]
root = "source"
from = "resources/vapor/shell-scripts/linux/vapor-launch.sh"
to = "bin/vapor-launch.sh"
required = true

[[root.steam.depots.linux.include]]
root = "installation"
from = "bin/x86_64-unknown-linux-gnu"
to = "bin/x86_64-unknown-linux-gnu"
target = "x86_64-unknown-linux-gnu"
exclude = [
    "vapor-gui",
    "vapor-launcher",
    "vapor-studio",
    "vapor-ide",
    "vapor-installer-gui",
    "vapor-setup",
    "vapor-installer",
]
required = true

[[root.steam.depots.linux.include]]
root = "output"
from = "content/packages/ghf-studios_loo-cast_loo-cast-packagepack/bin/x86_64-unknown-linux-gnu"
to = "content/default/ghf-studios/loo-cast/loo-cast-packagepack/bin/x86_64-unknown-linux-gnu"
target = "x86_64-unknown-linux-gnu"
required = true

[root.steam.depots.windows]
id = 2122623

[[root.steam.depots.windows.include]]
root = "source"
from = "resources/vapor/shell-scripts/windows/vapor-launch.cmd"
to = "bin/vapor-launch.cmd"
required = true

[[root.steam.depots.windows.include]]
root = "installation"
from = "bin/x86_64-pc-windows-gnullvm"
to = "bin/x86_64-pc-windows-gnullvm"
target = "x86_64-pc-windows-gnullvm"
exclude = [
    "vapor-gui.exe",
    "vapor-launcher.exe",
    "vapor-studio.exe",
    "vapor-ide.exe",
    "vapor-installer-gui.exe",
    "vapor-setup.exe",
    "vapor-installer.exe",
]
required = true

[[root.steam.depots.windows.include]]
root = "installation"
from = "bin/x86_64-pc-windows-gnullvm/libunwind.dll"
to = "bin/x86_64-pc-windows-gnullvm/libunwind.dll"
target = "x86_64-pc-windows-gnullvm"
required = true

[[root.steam.depots.windows.include]]
root = "output"
from = "content/packages/ghf-studios_loo-cast_loo-cast-packagepack/bin/x86_64-pc-windows-gnullvm"
to = "content/default/ghf-studios/loo-cast/loo-cast-packagepack/bin/x86_64-pc-windows-gnullvm"
target = "x86_64-pc-windows-gnullvm"
required = true

[root.runtime]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-gnullvm",
]
