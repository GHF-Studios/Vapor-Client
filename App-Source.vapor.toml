schema = 1

[root]
name = "loo-cast"
organization = "ghf-studios"
version = "0.5.0"
repository = "https://github.com/GHF-Studios/Loo-Cast"

[root.steam]
app-id = 2122620
development-branch = "vapor-dev"

# Loo-Cast's Steam app owns these first-party product files. The products are
# staged from the locally installed Vapor content tree into Steam depots; they
# are not Workshop dependencies or Vapor Artifact Server downloads at runtime.
[root.steam.depots.common]
id = 2122621

[[root.steam.depots.common.include]]
root = "source"
from = "App.vapor.toml"
to = "App.vapor.toml"
required = true

[[root.steam.depots.common.include]]
root = "product"
from = "content/installed/ghf-studios/loo-cast/spacetime-engine"
to = "content/installed/ghf-studios/loo-cast/spacetime-engine"
required = true
exclude = ["lib"]

# The default App is a depot-owned runtime closure, assembled from reviewed
# content packages. Source and mutable Library/index state are excluded.
[[root.steam.depots.common.include]]
root = "output"
from = "content/packages/ghf-studios_loo-cast_spacetime-engine/Engine.vapor.toml"
to = "content/default/ghf-studios/loo-cast/spacetime-engine/Engine.vapor.toml"
required = true
exclude = ["lib"]

[[root.steam.depots.common.include]]
root = "output"
from = "content/packages/ghf-studios_loo-cast_spacetime-engine/assets"
to = "content/default/ghf-studios/loo-cast/spacetime-engine/assets"
required = true

[[root.steam.depots.common.include]]
root = "output"
from = "content/packages/ghf-studios_loo-cast_loo-cast-game/Game.vapor.toml"
to = "content/default/ghf-studios/loo-cast/loo-cast-game/Game.vapor.toml"
required = true

[[root.steam.depots.common.include]]
root = "output"
from = "content/packages/ghf-studios_loo-cast_loo-cast-packagepack/Packagepack.vapor.toml"
to = "content/default/ghf-studios/loo-cast/loo-cast-packagepack/Packagepack.vapor.toml"
required = true
exclude = ["bin"]

[root.steam.depots.linux]
id = 2122622

[[root.steam.depots.linux.include]]
root = "product"
from = "content/installed/ghf-studios/loo-cast/spacetime-engine/lib/x86_64-unknown-linux-gnu"
to = "content/installed/ghf-studios/loo-cast/spacetime-engine/lib/x86_64-unknown-linux-gnu"
target = "x86_64-unknown-linux-gnu"
required = true

[[root.steam.depots.linux.include]]
root = "product"
from = "content/installed/ghf-studios/loo-cast/loo-cast-game/lib/x86_64-unknown-linux-gnu"
to = "content/installed/ghf-studios/loo-cast/loo-cast-game/lib/x86_64-unknown-linux-gnu"
target = "x86_64-unknown-linux-gnu"
required = true

[[root.steam.depots.linux.include]]
root = "product"
from = "content/installed/ghf-studios/loo-cast/loo-cast-packagepack/bin/x86_64-unknown-linux-gnu"
to = "content/installed/ghf-studios/loo-cast/loo-cast-packagepack/bin/x86_64-unknown-linux-gnu"
target = "x86_64-unknown-linux-gnu"
exclude = ["vapor-launcher", "vapor-studio", "vapor-ide", "vapor-installer-gui"]
required = true

[[root.steam.depots.linux.include]]
root = "output"
from = "content/packages/ghf-studios_loo-cast_loo-cast-packagepack/bin/x86_64-unknown-linux-gnu"
to = "content/default/ghf-studios/loo-cast/loo-cast-packagepack/bin/x86_64-unknown-linux-gnu"
target = "x86_64-unknown-linux-gnu"
required = true

[root.steam.depots.windows]
id = 2122623

[[root.steam.depots.windows.include]]
root = "product"
from = "content/installed/ghf-studios/loo-cast/spacetime-engine/lib/x86_64-pc-windows-gnullvm"
to = "content/installed/ghf-studios/loo-cast/spacetime-engine/lib/x86_64-pc-windows-gnullvm"
target = "x86_64-pc-windows-gnullvm"
exclude = ["vapor-launcher.exe", "vapor-studio.exe", "vapor-ide.exe", "vapor-installer-gui.exe"]
required = true

[[root.steam.depots.windows.include]]
root = "product"
from = "content/installed/ghf-studios/loo-cast/loo-cast-game/lib/x86_64-pc-windows-gnullvm"
to = "content/installed/ghf-studios/loo-cast/loo-cast-game/lib/x86_64-pc-windows-gnullvm"
target = "x86_64-pc-windows-gnullvm"
required = true

[[root.steam.depots.windows.include]]
root = "product"
from = "content/installed/ghf-studios/loo-cast/loo-cast-packagepack/bin/x86_64-pc-windows-gnullvm"
to = "content/installed/ghf-studios/loo-cast/loo-cast-packagepack/bin/x86_64-pc-windows-gnullvm"
target = "x86_64-pc-windows-gnullvm"
required = true

[[root.steam.depots.windows.include]]
root = "output"
from = "content/packages/ghf-studios_loo-cast_loo-cast-packagepack/bin/x86_64-pc-windows-gnullvm"
to = "content/default/ghf-studios/loo-cast/loo-cast-packagepack/bin/x86_64-pc-windows-gnullvm"
target = "x86_64-pc-windows-gnullvm"
required = true

[root.runtime]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-gnullvm",
]
